name: Python data integrity tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q scripts app.py
      - name: Install report generation dependencies
        run: python -m pip install "reportlab>=4.2,<5" "Pillow>=10,<12" "svglib>=2.0,<3"
      - name: Test data preparation, report exports and review decisions
        run: python -m unittest discover -s tests -v
